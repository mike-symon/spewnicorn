</style></head><body><h1>🦄🌈 Spewnicorn Sound Board</h1><p>Tap a button to hear that sound. 🗣️ = spoken by the device's voice (picks a random line; needs sound on, not silent mode).</p>

<button onclick="play(1)"><b>2.</b> Streak chime level 1</button>
<button onclick="play(2)"><b>3.</b> Streak chime level 3</button>
<button onclick="play(3)"><b>4.</b> Streak chime level 5 (cascade)</button>
<button onclick="play(4)"><b>5.</b> Streak chime level 6+ (with fanfare)</button>
<button onclick="play(5)"><b>6.</b> Fanfare on its own (part of streak 6+)</button>
<button onclick="play(6)"><b>7.</b> Leprechaun hit - grunt + fiery boom (as in game)</button>
<button onclick="play(7)"><b>8.</b> Leprechaun grunt on its own</button>
<button onclick="play(8)"><b>9.</b> Crunchy fiery explosion boom on its own</button>

<button onclick="play(15)"><b>16.</b> Irish line - grab (random) 🗣️</button>
<button onclick="play(16)"><b>17.</b> Irish line - defeated (random) 🗣️</button>

<button onclick="play(18)"><b>19.</b> Irish line - grumpy (unused) 🗣️</button>

  const PHRASES = { run: ["Me gold!", "Top o' the mornin'!", "Begorrah!", "Ah, to be sure!", "That's mine, so it is!", "Hee hee, me pot!"],
    grab: ["Me gold!", "That's mine, so it is!", "Got it, so I have!", "Ah, to be sure!"],
    grumpy: ["Ah, would ya stop!", "Ugh, me lovely coat!", "Not again, ya eejit!", "Grrr, rainbows!", "Away with ye!", "Ah, for the love of shamrocks!", "Well that's just grand.", "Me mane's ruined!"],
